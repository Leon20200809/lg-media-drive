name: lg-media-drive

services:
  web:
    image: nginx:1.31.10-alpine
    ports:
      - "127.0.0.1:8187:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/app/public:ro
    depends_on:
      - php
    networks: [media]

  php:
    build:
      context: .
      dockerfile: php.Dockerfile
    user: "${LG_UID:-1000}:${LG_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/lg-composer
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    networks: [media]

  db:
    image: mariadb:10.11.19
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-lg_media_drive}"
      MARIADB_USER: "${DB_USERNAME:-media_drive}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?run docker/init-env.sh first}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?run docker/init-env.sh first}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/mysql
    networks: [media]

  node:
    image: node:24.22.3-bookworm-slim
    profiles: [assets]
    user: "${LG_UID:-1000}:${LG_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/lg-npm
    volumes:
      - ..:/app
    networks: [media]

networks:
  media:

volumes:
  database:
